plugins { id 'net.fabricmc.fabric-loom' version '1.19.4'; id 'maven-publish' }
version = '1.0.0'
group = 'dev.restock'
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:26.3'
 implementation 'net.fabricmc:fabric-loader:0.20.1'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.166.0+26.3'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform() }

jar { from('LICENSE') { rename { 'LICENSE_shulker-autorestock' } } }
