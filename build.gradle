plugins { id 'net.fabricmc.fabric-loom' version '1.19.4'; id 'maven-publish' }
version = project.mod_version
group = 'dev.restock'
repositories { mavenCentral() }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 implementation "net.fabricmc:fabric-loader:${project.loader_version}"
 implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
 testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int); withSourcesJar() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform() }

jar { from('LICENSE') { rename { 'LICENSE_shulker-autorestock' } } }
